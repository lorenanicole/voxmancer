[pytest]
# Pytest configuration
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    unit: Unit tests for individual components (fast, isolated, mocked)
    integration: Integration tests for subsystems working together (medium speed)
    e2e: End-to-end tests for full CLI workflows (slow, requires all dependencies)
    slow: marks tests as slow (deselect with '-m "not slow"')
    timeout: pytest-timeout marker for setting per-test timeouts
    requires_piper: Requires Piper TTS CLI installed
    requires_llm: Requires LLM backend configured (Ollama or Anthropic)
timeout = 300
