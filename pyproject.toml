[tool.poetry]
name = "voxmancer"
version = "0.1.0"
description = "Forge voices for your D&D NPCs with multiple TTS backends"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "voxmancer"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = ">=2.6"
pyyaml = ">=6.0"
httpx = ">=0.27"
python-dotenv = ">=1.0"
elevenlabs = ">=1.0"
anthropic = ">=0.34"
boto3 = ">=1.34"

# Optional TTS backends
piper-tts = {version = ">=1.2", optional = true}
kokoro = {version = ">=0.3.0", optional = true}

[tool.poetry.extras]
piper = ["piper-tts"]
kokoro = ["kokoro"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-timeout = "^2.1.0"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
invoke = "^2.2.0"

[tool.poetry.scripts]
voxmancer = "voxmancer.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
